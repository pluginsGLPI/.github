labels:
  - name: "invalid"
    labeled:
      issue:
        body: |
            This issue has been closed because you did not provide the requested information.
        action: "close"
  - name: "support"
    labeled:
      issue:
        body: |
            This issue has been closed as we only track bugs here.

            You can get community support on [forums](https://forum.glpi-project.org/) or you can consider [taking a subscription](https://glpi-project.org/subscriptions/) to get professional support.
            You can also [contact GLPI editor team](https://glpi-project.org/contact_us/) directly.
        action: "close"
  - name: "feature suggestion"
    labeled:
      issue:
        body: |
            This issue has been closed as we only track bugs here.

            You can open a topic to discuss with community about this enhancement on [suggestion website](https://suggest.glpi-project.org).
            You can also [contact GLPI editor team](https://glpi-project.org/contact_us/) directly if you are willing to sponsor this feature.
        action: "close"
  - name: "not reproducible"
    labeled:
      issue:
        body: |
            This issue has been closed because we could not reproduce it on the latest release.

            Feel free to reopen it with the exact steps to reproduce it on the latest release.
        action: "close"
  - name: "security report"
    labeled:
      issue:
        body: |
            This issue has been closed because security problems must not be reported publicly.

            Please edit it to remove the vulnerability details, then report it privately as described in our [security policy](https://github.com/pluginsGLPI/.github/blob/main/SECURITY.md).
        action: "close"
