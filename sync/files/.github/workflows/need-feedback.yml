name: "Need feedback"

on:
  issue_comment:
    types:
      - "created"

jobs:
  answered:
    if: >-
      github.repository == 'pluginsGLPI/{PLUGIN}'
      && github.event.comment.user.login == github.event.issue.user.login
      && contains(github.event.issue.labels.*.name, 'need feedback')
    permissions:
      issues: "write"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Remove the need feedback label"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "need feedback"
